# clic_paper_small_C1_a2a3a4 -- A2 + A3 + A4, on the paper tag's small model.
#
# Generated from configs/base_small.yaml by studies/model_size/make_arms.py; every line that
# differs from base_small.yaml carries an "A2:", "A3:" or "A4:" comment. The arm definitions are
# the head-based study's (main: studies/model_size), re-derived on the paper tag's code:
#   A2  dense_kwargs.hidden_dim_scale 2 -> 1 in every encoder and decoder block
#   A3  dim 64 -> 48, the dim-derived head literals scaled by 0.75, num_heads 8 -> 6
#   A4  encoder num_layers 6 -> 5
# Everything else, including the training recipe, is the reference's. Compare against the
# reference run of this study (base_small.yaml at the same geometry), never against head runs.
#
name: clic_paper_small_C1_a2a3a4
seed_everything: 42

data:
  inputs:
    hit:
      - "x"
      - "y"
      - "z"
      - "r"
      - "s"
      - "theta"
      - "phi"

  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  num_objects: &num_particles 150

  # HPG data paths (patched from the authors' /share/gpu1/... paths — same dataset, same filenames).
  # test_path uses our common-infer file (test is not used during `fit`).
  train_path: /blue/avery/m.mazza/projects/fastml/hepattn/data/clic/train_clic_fix.root
  valid_path: /blue/avery/m.mazza/projects/fastml/hepattn/data/clic/val_clic_fix.root
  test_path: /blue/avery/m.mazza/projects/fastml/hepattn/data/clic/test_clic_common_infer.root

  num_workers: 16
  num_train: -1
  num_test: -1
  num_val: 5000

  # 170/GPU x 6 L4 = global 1020 ~= paper's 512x2=1024 (paper ran 2x A100; L4 can't hold 512/GPU).
  batch_size: 170
  incidence_cutval: 0.01

  scale_dict_path: &scale_dict_path configs/clic_var_transform.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 2
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: logs
  enable_progress_bar: True

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: hepattn-clic

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
        # every_n_train_steps: 1000
    - class_path: hepattn.experiments.clic.PflowPredictionWriter
      # init_args:
      #   write_inputs: true
      #   write_outputs: true
      #   write_preds: true
      #   write_targets: true
      #   write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-6
    max: 8e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-4
    skip_scheduler: false

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 48                        # A3: 64 -> 48
      raw_variables:
        - "node_e"
        - "node_pt"
        - "node_eta"
        - "node_sinphi"
        - "node_cosphi"
        - "node_is_track"

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 27
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 5                 # A4: encoder 6 -> 5 layers
          dim: *dim
          attn_type: flash-varlen
          hybrid_norm: true
          value_residual: true
          num_register_tokens: 8
          dense_kwargs:
            hidden_dim_scale: 1           # A2: MLP hidden 2*dim -> 1*dim
          attn_kwargs:
            num_heads: 6                  # A3: 8 -> 6 (head_dim stays 8; flash-attn needs head_dim % 8 == 0)

      decoder:
        num_decoder_layers: 4
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          hybrid_norm: true
          dense_kwargs:
            hidden_dim_scale: 1           # A2: MLP hidden 2*dim -> 1*dim
          attn_kwargs:
            num_heads: 6                  # A3: 8 -> 6 (head_dim stays 8)

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: classification
                input_object: query
                output_object: pflow
                target_object: particle
                num_classes: 5
                losses:
                  object_ce: 2
                costs:
                  object_ce: 2
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: 6
                    hidden_layers: [48, 96, 24]      # A3: dim-derived, [64, 128, 32] * 0.75
                null_weight: 0.5
                loss_class_weights: [1.0, 3.0, 8.0, 1.5, 1.0]
                mask_queries: false
                has_intermediate_loss: true

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.1
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs:
                  # mask_bce: 5.0
                  mask_dice: 1.0
                dim: *dim
                null_weight: 1.0
                has_intermediate_loss: true

            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                losses:
                  kl_div: 1.0
                costs:
                  kl_div: 1.0
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: *dim
                    hidden_layers: [*dim, *dim]      # paper structure at width 64 -> [64, 64]
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    output_size: *dim
                    hidden_layers: [*dim]            # -> [64]
                has_intermediate_loss: false

            - class_path: hepattn.models.task.IncidenceBasedRegressionTask
              init_args:
                name: regression
                fields: ["e", "pt", "eta", "sinphi", "cosphi"]
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                loss: l1
                loss_weight: 10.0
                cost_weight: 10.0
                use_incidence: true
                use_nodes: true
                cost: new
                mode: scale
                scale_dict_path: *scale_dict_path
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 102                  # A3: 2*48 + 6 raw node vars
                    activation: torch.nn.SiLU
                    output_size: 5
                    hidden_layers: [96, 96, 96, 48, 24]      # A3: [128, 128, 128, 64, 32] * 0.75
                has_intermediate_loss: false
